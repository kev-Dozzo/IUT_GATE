name: CI/CD — IUTGate

on:
  push:
    branches: [main]      # ← déclenche sur push direct sur main
  pull_request:
    branches: [main]      # ← teste sur les PR mais sans déployer

jobs:

  # ── TEST BACKEND ──
  test:
    runs-on: ubuntu-latest
    name: Tests Backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: back_end/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./back_end

      - name: Check syntax
        run: node --check src/server.js
        working-directory: ./back_end

  # ── BUILD FRONTEND ──
  build-frontend:
    runs-on: ubuntu-latest
    name: Build Frontend
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front_end/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./front_end

      - name: Build
        run: npm run build
        working-directory: ./front_end
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front_end/dist/

  # ── DEPLOY BACKEND → RENDER ──
  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Backend → Render
    needs: test
    # ← Déploie SEULEMENT sur push vers main (pas sur PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -d '{}'

  # ── DEPLOY FRONTEND → VERCEL ──
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy Frontend → Vercel
    needs: build-frontend
    # ← Déploie SEULEMENT sur push vers main (pas sur PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        working-directory: ./front_end
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── NOTIFICATION ──
  notify:
    runs-on: ubuntu-latest
    name: Notification
    needs: [deploy-backend, deploy-frontend]
    # ← Ne tourne que si les 2 deploys ont tourné (pas skipped)
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Résultat du déploiement
        run: |
          BACKEND="${{ needs.deploy-backend.result }}"
          FRONTEND="${{ needs.deploy-frontend.result }}"
          echo "Backend: $BACKEND"
          echo "Frontend: $FRONTEND"
          if [ "$BACKEND" == "success" ] && [ "$FRONTEND" == "success" ]; then
            echo "✅ Déploiement réussi !"
          else
            echo "❌ Déploiement échoué — Backend: $BACKEND | Frontend: $FRONTEND"
            exit 1
          fi