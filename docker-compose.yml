version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: iutgate-db
    environment:
      POSTGRES_DB:       iut_gate
      POSTGRES_USER:     iutgate_user
      POSTGRES_PASSWORD: IutGate2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iutgate_user -d iut_gate"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./back_end
    container_name: iutgate-api
    environment:
      PORT:           5000
      NODE_ENV:       production
      DATABASE_URL:   postgresql://iutgate_user:IutGate2026!@postgres:5432/iut_gate
      JWT_SECRET:     ${JWT_SECRET}
      EMAIL_USER:     ${EMAIL_USER}
      EMAIL_PASS:     ${EMAIL_PASS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./front_end
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: iutgate-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data: